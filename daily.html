<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>S 4 일상 - science 4 all</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #808080; /* 회색 배경 */
            height: 100vh; display: flex; justify-content: center; align-items: flex-end;
            font-family: 'Malgun Gothic', sans-serif; position: relative;
        }

        /* 흰색 컨테이너: 양옆 60pt, 위 30pt 여백 */
        .white-container {
            background-color: white;
            width: calc(100% - 120pt); height: calc(100% - 30pt);
            border-top-left-radius: 20px; border-top-right-radius: 20px;
            display: flex; flex-direction: column; align-items: center;
            padding: 30px; box-sizing: border-box; overflow-y: auto;
        }

        /* 상단 버튼 및 필터 영역 */
        .top-nav { width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
        
        .survey-btn {
            background-color: #333; color: white; border: none; padding: 12px 25px;
            border-radius: 5px; cursor: pointer; font-size: 16px; margin-bottom: 20px;
        }

        .filter-group { display: flex; gap: 10px; }
        .filter-btn {
            background-color: #eee; border: 1px solid #ccc; padding: 8px 15px;
            border-radius: 20px; cursor: pointer; font-size: 14px;
        }
        .filter-btn.active { background-color: #808080; color: white; border-color: #808080; }

        /* 게시물 리스트 */
        .post-list { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .post-card { border: 1px solid #ddd; border-radius: 10px; padding: 15px; background: #fff; }
        .category-tag { font-size: 12px; color: #808080; font-weight: bold; }
        .post-title { font-size: 18px; margin: 10px 0; font-weight: bold; }

        /* 모달(설문조사 작은 창) 스타일 */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 30px; border-radius: 15px; text-align: center; width: 300px; }
        .modal-content h3 { margin-top: 0; }
        .survey-option {
            display: block; width: 100%; padding: 10px; margin: 5px 0;
            background: #f0f0f0; border: none; border-radius: 5px; cursor: pointer;
        }
        .survey-option:hover { background: #ddd; }
    </style>
</head>
<body>

    <div class="white-container">
        <div class="top-nav">
            <button class="survey-btn" onclick="openModal()">관심 있는 분야 설문 조사하기</button>
            <div class="filter-group">
                <button class="filter-btn active" onclick="filterPosts('전체')">전체</button>
                <button class="filter-btn" onclick="filterPosts('물리')">물리</button>
                <button class="filter-btn" onclick="filterPosts('화학')">화학</button>
                <button class="filter-btn" onclick="filterPosts('생명과학')">생명과학</button>
                <button class="filter-btn" onclick="filterPosts('지구과학')">지구과학</button>
                <button class="filter-btn" onclick="filterPosts('정보과학')">정보과학</button>
            </div>
        </div>

        <div class="post-list" id="post-container">
            <div class="post-card" data-category="물리">
                <span class="category-tag">물리</span>
                <div class="post-title">양자 역학의 기초</div>
                <p>현대 물리학의 핵심인 양자 역학을 알아봅니다.</p>
            </div>
            <div class="post-card" data-category="정보과학">
                <span class="category-tag">정보과학</span>
                <div class="post-title">AI 알고리즘 이해</div>
                <p>최신 생성형 AI의 원리를 탐구합니다.</p>
            </div>
        </div>
    </div>

    <div class="modal" id="surveyModal">
        <div class="modal-content">
            <h3>분야 선택</h3>
            <button class="survey-option" onclick="submitSurvey('물리')">물리</button>
            <button class="survey-option" onclick="submitSurvey('화학')">화학</button>
            <button class="survey-option" onclick="submitSurvey('생명과학')">생명과학</button>
            <button class="survey-option" onclick="submitSurvey('지구과학')">지구과학</button>
            <button class="survey-option" onclick="submitSurvey('정보과학')">정보과학</button>
            <button style="margin-top:15px; background:none; border:none; color:red; cursor:pointer;" onclick="closeModal()">닫기</button>
        </div>
    </div>

    <script>
        // 필터링 기능
        function filterPosts(category) {
            const cards = document.querySelectorAll('.post-card');
            const btns = document.querySelectorAll('.filter-btn');
            
            btns.forEach(btn => {
                btn.classList.toggle('active', btn.innerText === category);
            });

            cards.forEach(card => {
                if (category === '전체' || card.getAttribute('data-category') === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // 모달 제어
        function openModal() { document.getElementById('surveyModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('surveyModal').style.display = 'none'; }

        // 설문 조사 제출 (Neon DB 연동 로직 포함 예정)
        async function submitSurvey(field) {
            console.log("선택된 분야:", field);
            // 백엔드 API 호출 예시: fetch('/api/survey', { method: 'POST', body: JSON.stringify({ field }) })
            alert(`${field} 분야가 선택되었습니다. 통계에 반영됩니다!`);
            closeModal();
        }
    </script>
</body>
</html>
