<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>science 4 all</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; }
        .page { display: none; height: 100vh; width: 100vw; background-color: #007BFF; position: relative; }
        .active { display: flex; flex-direction: column; align-items: center; }
        .white-container {
            background-color: white; width: calc(100% - 120pt); height: calc(100% - 30pt);
            margin-top: 30pt; border-top-left-radius: 20px; border-top-right-radius: 20px;
            display: flex; justify-content: center; align-items: center; position: relative;
        }
        .title-box {
            position: absolute; top: 20pt; left: 50%; transform: translateX(-50%);
            background-color: #FFFDD0; padding: 5px 40px; border-radius: 10px; z-index: 5;
        }
        .title-text { font-size: 40pt; font-weight: bold; margin: 0; color: #333; }
        .nav-login-btn {
            position: absolute; left: 20pt; top: 10pt; background-color: white;
            border: none; padding: 8px 25px; border-radius: 5px; cursor: pointer; font-size: 14pt; font-weight: bold; z-index: 10;
        }
        .grid-container { display: grid; grid-template-columns: repeat(2, 220px); gap: 25px; }
        .grid-btn { border: none; border-radius: 12px; font-size: 18pt; font-weight: bold; color: white; cursor: pointer; height: 120px; }
        .btn-orange { background-color: #FF8C00; }
        .btn-gray { background-color: #808080; }
        .btn-green { background-color: #90EE90; color: #333; }
        .btn-blue { background-color: #ADD8E6; color: #333; }

       /* --- 로그인/회원가입 섹션 스타일 --- */
        .auth-overlay {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }
        .auth-overlay h2 { color: #007BFF; margin-bottom: 20px; }
        .auth-overlay input {
            width: 100%; padding: 12px; margin: 10px 0;
            border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;
        }
        .auth-overlay button {
            width: 100%; padding: 12px; background-color: #007BFF;
            color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;
        }
        .toggle-link { margin-top: 15px; font-size: 14px; color: #666; }
        .toggle-link span { color: #007BFF; cursor: pointer; text-decoration: underline; }
        .back-home { margin-top: 20px; display: block; color: #999; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>

    <div id="main-page" class="page active">
        <button class="nav-login-btn" onclick="showPage('auth-page')">로그인</button>
        <div class="title-box"><p class="title-text">사이언스 4 all</p></div>
        <div class="white-container">
            <div class="grid-container">
                <button class="grid-btn btn-orange" onclick="location.href='naesin.html'">S 4 내신</button>
                <button class="grid-btn btn-gray" onclick="location.href='daily.html'">S 4 일상</button>
                <button class="grid-btn btn-green" onclick="location.href='life.html'">S 4 생활</button>
                <button class="grid-btn btn-blue" onclick="location.href='motivation.html'" style="font-size: 14pt;">이 사이트의 제작 동기</button>

            </div>
        </div>
    </div>
    <div id="auth-page" class="page">
        <div class="auth-overlay">
            <div id="login-section">
                <h2>로그인</h2>
                <input type="text" id="l-id" placeholder="아이디">
                <input type="password" id="l-pw" placeholder="비밀번호">
                <button onclick="handleAuth('login')">로그인</button>
                <div class="toggle-link">계정이 없나요? <span onclick="toggleAuthForm(true)">계정 추가하기</span></div>
            </div>

            <div id="signup-section" style="display: none;">
                <h2>계정 추가하기</h2>
                <input type="text" id="s-id" placeholder="사용할 아이디">
                <input type="password" id="s-pw" placeholder="비밀번호">
                <button onclick="handleAuth('signup')">가입하기</button>
                <div class="toggle-link">이미 계정이 있나요? <span onclick="toggleAuthForm(false)">로그인으로</span></div>
            </div>
            
            <span class="back-home" onclick="showPage('main-page')">← 메인으로 돌아가기</span>
        </div>
    </div>

    <script>
            function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // 로그인/회원가입 폼 전환
        function toggleAuthForm(isSignup) {
            document.getElementById('login-section').style.display = isSignup ? 'none' : 'block';
            document.getElementById('signup-section').style.display = isSignup ? 'block' : 'none';
        }

        // 인증 처리 (Neon DB 연동 로직이 들어갈 자리)
        async function handleAuth(type) {
    const idField = type === 'login' ? 'l-id' : 's-id';
    const pwField = type === 'login' ? 'l-pw' : 's-pw';
    
    const id = document.getElementById(idField).value;
    const pw = document.getElementById(pwField).value;

    if(!id || !pw) return alert("정보를 모두 입력해주세요.");

    // API 경로 설정 (로그인 또는 회원가입)
    const endpoint = type === 'login' ? '/api/login' : '/api/signup';

    try {
        const response = await fetch(`http://localhost:3000${endpoint}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: id, password: pw })
        });

        const result = await response.json();

        if (response.ok) {
            alert(result.message);
            
            if (type === 'login') {
                // 로그인 성공 시 사용자 이름을 저장하여 다른 페이지에서 사용
                localStorage.setItem('username', result.username);
                // 메인 페이지로 이동 (UI 전환)
                showPage('main-page');
                // 로그인 버튼을 사용자 이름으로 변경하는 등의 처리 가능
                document.querySelector('.nav-login-btn').innerText = `${result.username}님`;
            } else {
                // 회원가입 성공 시 로그인 폼으로 전환
                toggleAuthForm(false);
            }
        } else {
            alert(result.message);
        }
    } catch (error) {
        console.error("Error:", error);
        alert("서버와 통신할 수 없습니다.");
    }

            if(!id || !pw) return alert("정보를 모두 입력해주세요.");

        }
    
    </script>
</body>
</html>
