<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>S 4 생활 - science 4 all</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #28A745; /* 초록색 배경 */
            height: 100vh; display: flex; justify-content: center; align-items: center;
            font-family: 'Malgun Gothic', sans-serif;
        }

        /* 흰색 컨테이너: 양옆 60pt, 위아래 30pt 여백 */
        .white-container {
            background-color: white;
            width: calc(100% - 120pt); 
            height: calc(100% - 60pt);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
            overflow-y: auto; /* 게시글이 많아지면 스크롤 */
        }

        h2 { color: #28A745; border-bottom: 2px solid #28A745; padding-bottom: 10px; }

        /* 게시글 작성 영역 */
        .post-input-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid #ddd;
        }
        .post-input-section input, .post-input-section textarea {
            width: 100%; margin-bottom: 10px; padding: 10px;
            border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;
        }
        .btn-post {
            background-color: #28A745; color: white; border: none;
            padding: 10px 20px; border-radius: 5px; cursor: pointer; float: right;
        }

        /* 게시물 목록 스타일 */
        .post-card {
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .post-header { font-weight: bold; color: #333; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .post-content { margin-bottom: 15px; line-height: 1.6; }

        /* 댓글 영역 */
        .comment-section {
            background: #f1f1f1;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }
        .comment-item { border-bottom: 1px solid #e0e0e0; padding: 5px 0; }
        .comment-input-group { display: flex; margin-top: 10px; gap: 5px; }
        .comment-input-group input { flex: 1; padding: 5px; border: 1px solid #ccc; border-radius: 3px; }
        .btn-comment { background: #6c757d; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="white-container">
        <h2>S 4 생활 - 자유게시판</h2>

        <div class="post-input-section">
            <input type="text" id="post-title" placeholder="제목을 입력하세요">
            <textarea id="post-content" rows="3" placeholder="내용을 입력하세요"></textarea>
            <button class="btn-post" onclick="addPost()">게시물 추가</button>
            <div style="clear:both;"></div>
        </div>

        <div id="post-list">
            <div class="post-card">
                <div class="post-header">
                    <span>작성자: 관리자</span>
                    <span>2026-04-10</span>
                </div>
                <div class="post-content">science 4 all의 생활 게시판에 오신 것을 환영합니다! 과학적인 일상을 공유해 주세요.</div>
                <div class="comment-section" id="comments-0">
                    <div class="comment-item"><b>탐구인:</b> 정말 기대되네요!</div>
                    <div class="comment-input-group">
                        <input type="text" placeholder="댓글을 남겨보세요">
                        <button class="btn-comment">등록</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 백엔드 서버 주소 (서버 실행 시 포트 번호 확인)
const API_BASE = "http://localhost:3000/api";

// 페이지가 열리자마자 실행되는 함수
window.onload = async () => {
    await loadPosts();
};

/**
 * 1. 게시글 불러오기 (Read)
 * 서버에서 전체 게시글 목록을 가져와 화면에 그립니다.
 */
async function loadPosts() {
    try {
        const response = await fetch(`${API_BASE}/posts`);
        const posts = await response.json();
        const postList = document.getElementById('post-list');
        
        postList.innerHTML = ''; // 기존 리스트 비우기

        posts.forEach(post => {
            const postDiv = document.createElement('div');
            postDiv.className = 'post-card';
            
            // 날짜 형식 예쁘게 변경
            const postDate = new Date(post.created_at).toLocaleString();

            postDiv.innerHTML = `
                <div class="post-header">
                    <span><strong>${post.title}</strong> (작성자: ${post.username})</span>
                    <span style="font-size: 0.8em; color: #888;">${postDate}</span>
                </div>
                <div class="post-content">${post.content}</div>
                <div class="comment-section">
                    <div id="comments-container-${post.id}">
                        </div>
                    <div class="comment-input-group">
                        <input type="text" id="comment-input-${post.id}" placeholder="댓글을 남겨보세요">
                        <button class="btn-comment" onclick="addComment(${post.id})">등록</button>
                    </div>
                </div>
            `;
            postList.appendChild(postDiv);
        });
    } catch (error) {
        console.error("데이터 불러오기 실패:", error);
    }
}

/**
 * 2. 게시글 추가하기 (Create)
 * 사용자가 입력한 데이터를 서버에 전송합니다.
 */
async function addPost() {
    const title = document.getElementById('post-title').value;
    const content = document.getElementById('post-content').value;
    
    // 로그인이 구현되었다면 localStorage에서 가져오고, 없으면 '익명' 사용
    const username = localStorage.getItem('username') || '익명과학자';

    if (!title || !content) return alert("제목과 내용을 모두 입력해주세요!");

    try {
        const response = await fetch(`${API_BASE}/posts`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, title, content })
        });

        if (response.ok) {
            alert("게시글이 등록되었습니다!");
            // 입력창 비우기
            document.getElementById('post-title').value = '';
            document.getElementById('post-content').value = '';
            // 목록 새로고침
            await loadPosts();
        }
    } catch (error) {
        console.error("Error:", error);
        alert("서버 전송 중 오류가 발생했습니다.");
    }
}

/**
 * 3. 댓글 등록하기 (Create)
 */
async function addComment(postId) {
    const inputField = document.getElementById(`comment-input-${postId}`);
    const content = inputField.value;
    const username = localStorage.getItem('username') || '익명댓글러';

    if (!content) return alert("댓글 내용을 입력하세요.");

    try {
        const response = await fetch(`${API_BASE}/comments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ post_id: postId, username, content })
        });

        if (response.ok) {
            inputField.value = '';
            alert("댓글이 등록되었습니다.");
            await loadPosts(); // 댓글 반영을 위해 새로고침
        }
    } catch (error) {
        console.error("댓글 등록 실패:", error);
    }
}
    </script>

</body>
</html>
